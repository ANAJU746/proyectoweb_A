{% extends 'partials/sidebar_base.html' %}
{% load static %}
{% block title %}Editar Categoría{% endblock %}

{% block sidebar_content %}
<div class="container mt-2">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Editar Categoría</h2>
        <a href="{% url 'home:crud_categorias' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>
    </div>

    <div class="card border-0 bg-light p-4">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Nombre de la categoría</label>
                <input type="text" name="nombre" class="form-control" value="{{ categoria.nombre }}" required>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a href="{% url 'home:crud_categorias' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock sidebar_content %}
