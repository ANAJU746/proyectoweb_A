<style>
  .active-sidebar {
    background-color: #e11d48;
    border-color: #e11d48;
    color: #ffffff;
  }
</style>

<div class="list-group list-group-flush rounded-0 shadow-sm border">
  <a href="{% url 'home:perfil' %}" class="list-group-item list-group-item-action py-3 {% if request.resolver_match.url_name == 'perfil' or request.resolver_match.url_name == 'crud_perfil' %}active-sidebar{% endif %}">
    <i class="bi bi-person-badge me-2"></i> Mi Expediente
  </a>

  {% if es_administrador %}
  <a href="{% url 'home:crud_noticias' %}" class="list-group-item list-group-item-action py-3 {% if 'noticias' in request.path or 'publicacion' in request.resolver_match.url_name %}active-sidebar{% endif %}">
    <i class="bi bi-file-earmark-text me-2"></i> Publicaciones
  </a>
  <a href="{% url 'home:crud_comentarios' %}" class="list-group-item list-group-item-action py-3 {% if 'comentarios' in request.path or 'comentario' in request.resolver_match.url_name %}active-sidebar{% endif %}">
    <i class="bi bi-chat-square-text me-2"></i> Moderación
  </a>
  <a href="{% url 'home:crud_categorias' %}" class="list-group-item list-group-item-action py-3 {% if 'categorias' in request.path or 'categoria' in request.resolver_match.url_name %}active-sidebar{% endif %}">
    <i class="bi bi-bookmark-fill me-2"></i> Secciones / Categorías
  </a>
  <a href="{% url 'home:crud_usuarios' %}" class="list-group-item list-group-item-action py-3 {% if 'usuarios' in request.path or 'usuario' in request.resolver_match.url_name %}active-sidebar{% endif %}">
    <i class="bi bi-people me-2"></i> Directorio de Usuarios
  </a>
  {% endif %}

  <a href="{% url 'home:crud_cambiar_contrasena' %}" class="list-group-item list-group-item-action py-3 {% if 'contrasena' in request.path %}active-sidebar{% endif %}">
    <i class="bi bi-shield-lock me-2"></i> Seguridad / Clave
  </a>

  <a href="{% url 'home:logout' %}" class="list-group-item list-group-item-action py-3 text-danger fw-semibold">
    <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
  </a>
</div>
